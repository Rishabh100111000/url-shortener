

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | URL Shortener</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>URL Shortener</h1>
        <p class="subtitle">Create your short links</p>

        <form id="urlForm">

            <div class="input-group">
                <label>Enter URL</label>
                <input
                    type="url"
                    id="url"
                    placeholder="https://example.com"
                    required
                >
            </div>

            <button type="submit">
                Shorten URL
            </button>

        </form>

        <div id="result"></div>

        <button id="logoutBtn">
            Logout
        </button>

    </div>

</div>

<script src="js/dashboard.js"></script>

</body>
</html>
