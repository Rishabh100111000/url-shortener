<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 350px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
        }

        h2 {
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        p {
            text-align: center;
        }

        a {
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="container">

<h2>Register</h2>

<form id="registerForm">

<input
type="text"
id="name"
placeholder="Enter Name"
required>

<input
type="email"
id="email"
placeholder="Enter Email"
required>

<input
type="password"
id="password"
placeholder="Enter Password"
required>

<button type="submit">
Register
</button>

</form>

<p>
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

<!-- Fixed script src path to point to root register.js -->
<script src="js/register.js"></script>

</body>
</html>
